<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This tag is the secret to mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ data.full_date_time }}</h2>
        </div>

        <div class="section">
            <div class="duty-label">neko_duty: <span class="status-val">{{ data.neko_status }}</span></div>
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=500&auto=format&fit=crop" alt="Cat">
            <p class="duty-label demphasized"><i>day <u>{{ data.day_of_year }}({{ data.is_day_odd }})</u> of the year</span></i></p>
        </div>

        <div class="section">
            <div class="duty-label">wipey_duty: <span class="status-val">{{ data.wipey_status }}</span></div>
            <img src="{{ url_for('static', filename='barista-cleaning-table-while-wearing-medical-mask.jpg') }}" alt="Wiping table">
            <p class="duty-label demphasized"><i>week <u>{{ data.week_number }}({{ data.is_week_odd }})</u> of the year</span></i></p>
        </div>
    </div>
</body>
</html>
